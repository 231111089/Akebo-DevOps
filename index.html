<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akebo</title>

    <style>
        /* Mengatur seluruh halaman */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Judul */
        h1 {
            font-size: 50px;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Membuat li menjadi kartu */
        li {
            list-style: none;
            background: white;
            color: #333;
            width: 350px;
            margin: 12px 0;
            padding: 18px 25px;
            border-radius: 15px;
            box-sizing: border-box;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

            transition: all 0.3s ease;
        }

        /* Efek ketika mouse diarahkan */
        li:hover {
            transform: translateY(-5px) scale(1.03);
            background: #f3f0ff;
            color: #667eea;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>Akebo</h1>

    <li>Kendrick Husada</li>
    <li>Daniel Angkasa</li>
    <li>Lukito Hadisaputra</li>
    <li>Raymond Kurniadi</li>
    <li>Rivaldo Aurelio</li>

</body>
</html>
