<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: white;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 40px;

            color: white;

            letter-spacing: 5px;

            text-shadow:
                0 0 10px rgba(255,255,255,0.4),
                0 10px 30px rgba(0,0,0,0.5);
        }

        li {
            list-style: none;

            width: 400px;
            padding: 22px 28px;
            margin: 10px 0;

            box-sizing: border-box;

            background: rgba(255,255,255,0.95);
            color: #1e293b;

            border-radius: 14px;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.25);

            transition: 0.3s ease;
        }

        li:hover {
            transform: translateX(10px);

            background: white;

            color: #4f46e5;

            box-shadow:
                0 12px 30px rgba(99,102,241,0.4);

            cursor: pointer;
        }

    </style>
</head>
<body>
    <h1>Akebo</h1>

    <li>Kendrick Husada</li>
    <li>Daniel Angkasa</li>
    <li>Lukito Hadisaputra</li>
    <li>Raymond Kurniadi</li>
    <li>Rivaldo Aurelio</li>
</body>
</html>
